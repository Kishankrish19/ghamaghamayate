<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghamaghamayate - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F9F9F9;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Abstract blurred design accent in the background */
        .bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255,122,0,0.25) 0%, rgba(255,255,255,0) 70%);
            top: 20%;
            left: 30%;
            z-index: 1;
        }

        /* Minimalist UI Card with Frosted Glass Blur */
        .login-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 45px 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            z-index: 2;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #111;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        h1 span { color: #FF7A00; }

        .input-group { margin-bottom: 20px; text-align: left; }
        label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E5E5E5;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #FF7A00;
            box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #FF7A00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }
        button:hover { background: #E06B00; }

        .error-msg {
            color: #D93838;
            font-size: 0.9rem;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="login-card">
        <h1><span>G</span>hamaghamayate</h1>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="e.g., admin">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit">Sign In</button>
            <div id="error" class="error-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.get_json ? await response.json() : await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = data.redirect;
                } else {
                    errorDiv.textContent = data.message || 'Authentication failed.';
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error. Try running the server.';
            }
        });
    </script>
</body>
</html>
