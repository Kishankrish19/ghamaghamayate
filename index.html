<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghamaghamayate</title>
    <style>
        /* CSS Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #FAFAFA;
            /* Soft off-white background */
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #333333;
        }

        /* Minimalist Card Container */
        .card {
            text-align: center;
            padding: 50px 40px;
            background: #FFFFFF;
            border-top: 6px solid #FF7A00;
            /* Vibrant Orange Accent */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            color: #FF7A00;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #888888;
            font-style: italic;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .message {
            font-size: 1.05rem;
            color: #555555;
            line-height: 1.6;
        }

        .domain-name {
            color: #FF7A00;
            font-weight: 600;
        }

        /* Minimalist Loading Ring */
        .spinner {
            margin: 35px auto 0;
            width: 40px;
            height: 40px;
            border: 3px solid #FFF0E5;
            /* Very light orange */
            border-top: 3px solid #FF7A00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .card {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Ghamaghamayate</h1>
        <p class="subtitle">Radiating a beautiful essence</p>

        <p class="message">
            Welcome to <span class="domain-name">ghamaghamayate.dpdns.org</span>.<br>
            This space is currently being prepared. Check back later for something wonderful!
        </p>

        <div class="spinner"></div>
    </div>

</body>

</html>
